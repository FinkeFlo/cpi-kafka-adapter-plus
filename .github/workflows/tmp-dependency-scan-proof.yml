name: Dependency Scan proof (temporary)

# Temporary, removed again before the merge: shows that the scan configuration of
# dependency-scan.yml fails on the bundle of the 1.4.1 release because of org.lz4:lz4-java 1.8.0.

on:
  pull_request:

permissions:
  contents: read

jobs:
  scan-1-4-1:
    runs-on: ubuntu-latest
    steps:
      - name: Extract the bundle from the 1.4.1 release ESA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.4.1 --repo "$GITHUB_REPOSITORY" --pattern '*.esa' --dir esa
          mkdir -p scan
          unzip -j esa/*.esa 'cpi-kafka-adapter-plus-*.jar' -d scan
          ls -l scan

      - name: Scan the 1.4.1 bundle (Grype)
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: scan
          fail-build: false
          severity-cutoff: high
          output-format: json
          cache-db: true

      - name: The scan reports the LZ4 codec as high
        env:
          REPORT: ${{ steps.scan.outputs.json }}
        run: |
          jq -r '.matches[] | "\(.vulnerability.severity)\t\(.vulnerability.id)\t\(.artifact.purl)"' "$REPORT" | sort | uniq
          jq -e '[.matches[] | select((.artifact.purl | startswith("pkg:maven/org.lz4/lz4-java@1.8.0")) and .vulnerability.severity == "High")] | length > 0' "$REPORT"
