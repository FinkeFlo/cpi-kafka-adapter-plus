name: Deploy to CPI (E2E tenant)

# Maintainer-only, manually triggered deploy of a built .esa to the E2E test tenant,
# followed by an automated round-trip smoke test (issue #15) reusing the existing
# e2e-consumer-tests.yml / e2e-producer-tests.yml suites unchanged. Intended to test a
# not-yet-released branch/tag end-to-end before merging/releasing (see VERSIONING.md -
# the CPI-visible version is deployed as-is, never a preview qualifier). This is NOT
# part of the release pipeline (release.yml) and never runs on pull_request / push, so
# forked PRs can never reach it or its secrets.
#
# Security:
#   - workflow_dispatch only: nobody can trigger this via a PR (incl. forks).
#   - Restricted to a single GitHub Environment ("cpi-e2e-tenant") that must be
#     configured with required reviewers (only the maintainer) in repo Settings ->
#     Environments, so this job only runs after manual approval - even though the
#     E2E_CPI_API_* secrets it reuses are repository-wide (already used by
#     e2e-consumer-tests.yml on pull_request from trusted contexts), this workflow
#     itself can only ever be started via workflow_dispatch and only proceeds past
#     the environment gate with maintainer approval.
#   - Extra guard below (actor must equal the repo owner) as defense in depth even
#     if someone else has write access.
#
# Reuses the existing repository secrets already used by e2e-consumer-tests.yml:
#   E2E_CPI_API_TOKEN_URL, E2E_CPI_API_CLIENT_ID, E2E_CPI_API_CLIENT_SECRET, E2E_CPI_API_BASE_URL
# The "cpi-e2e-tenant" GitHub Environment (Settings -> Environments) still needs to be
# created and configured with a required reviewer (the maintainer) - that gate applies
# to any job referencing this environment regardless of where the secrets themselves
# are defined, so no secrets need to be duplicated/moved into the environment.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cpi-e2e-tenant
    steps:
      - name: Restrict to maintainer
        run: |
          if [ "${{ github.actor }}" != "${{ github.repository_owner }}" ]; then
            echo "::error::This workflow may only be run by the repository owner."
            exit 1
          fi

      # No custom `ref` input: workflow_dispatch already lets you pick the branch/tag
      # to run from (UI dropdown / `gh workflow run --ref`), and actions/checkout without
      # an explicit `ref:` checks out exactly that. Keeping this implicit also keeps the
      # chained e2e-*-tests.yml jobs below checking out the same ref automatically.
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (produces the ESA)
        run: mvn -B clean install -DskipITs

      - name: Locate ESA artifact
        id: esa
        run: |
          ESA="$(find target -name '*.esa' | head -1)"
          if [ -z "$ESA" ]; then
            echo "::error::No .esa archive was produced by the build"
            exit 1
          fi
          echo "path=$ESA" >> "$GITHUB_OUTPUT"
          echo "Found ESA: $ESA"

      - name: Read adapter version from config.adk
        id: ver
        run: |
          VERSION="$(grep -E '^Adapter-Version=' config.adk | cut -d= -f2 | tr -d '[:space:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying adapter version: $VERSION"

      - name: Upload and deploy to CPI
        env:
          CPI_API_TOKEN_URL: ${{ secrets.E2E_CPI_API_TOKEN_URL }}
          CPI_API_CLIENT_ID: ${{ secrets.E2E_CPI_API_CLIENT_ID }}
          CPI_API_CLIENT_SECRET: ${{ secrets.E2E_CPI_API_CLIENT_SECRET }}
          CPI_API_BASE_URL: ${{ secrets.E2E_CPI_API_BASE_URL }}
          # Note: CPI appends a per-tenant/deployer suffix to custom adapter Ids on first
          # deploy (verified live against the E2E tenant) - this is NOT simply config.adk's
          # Adapter-ID.
          ADAPTER_ID: kafkaAdapterPlus_FlorianKube
          ADAPTER_PACKAGE_ID: KafkaAdapterPlus
          ADAPTER_NAME: Kafka Adapter Plus
          ESA_PATH: ${{ steps.esa.outputs.path }}
          ADAPTER_VERSION: ${{ steps.ver.outputs.version }}
        run: python3 scripts/deploy_adapter_to_cpi.py

  # Automated post-deploy round-trip smoke test (see issue #15): reuses the existing,
  # already-passing E2E suites as-is (no duplicated test logic) instead of writing a
  # new one-off smoke test. Both assume the E2E test iFlows are already deployed on
  # the tenant (true here - only the custom adapter itself is (re)deployed above).
  #
  # NOTE: after an adapter bundle update, CPI iFlows keep the OLD OSGi bundle wiring
  # until they are restarted. Features that use BundleBackedClassLoader (e.g. Avro /
  # Schema Registry) will silently fail in iFlows that were not redeployed. If the
  # smoke tests fail with "got 0 MPL entries" for Avro or Schema Registry scenarios,
  # manually redeploy the affected E2E iFlow(s) on the tenant and rerun the failed jobs.
  smoke-test-consumer:
    needs: deploy
    uses: ./.github/workflows/e2e-consumer-tests.yml
    secrets: inherit

  smoke-test-producer:
    needs: deploy
    uses: ./.github/workflows/e2e-producer-tests.yml
    secrets: inherit
