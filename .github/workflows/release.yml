name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.17)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: main

      - name: Configure Git Bot
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update versions in codebase
        run: |
          VERSION="${{ inputs.version }}"
          echo "Setting codebase version to $VERSION"
          
          # 1. Update config.adk
          sed -i "s/^Adapter-Version=.*/Adapter-Version=$VERSION/" config.adk
          
          # 2. Update pom.xml
          mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false
          
          # 3. Update Metadata XMLs (ComponentId und VariantId)
          find src/main/resources/metadata -name "metadata-*.xml" -type f -exec sed -i "s/\/version::[0-9.]*\"/\/version::$VERSION\"/g" {} +
          find src/main/resources/metadata -name "metadata-*.xml" -type f -exec sed -i "s/\/version::[0-9.]*<\/Name>/\/version::$VERSION<\/Name>/g" {} +

      - name: Commit and push version bump
        run: |
          VERSION="${{ inputs.version }}"
          git add config.adk pom.xml src/main/resources/metadata/
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push origin main

      - name: Tag the commit
        run: |
          VERSION="${{ inputs.version }}"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test and package (produces the ESA)
        run: mvn -B clean install

      - name: Locate ESA artifact
        id: esa
        run: |
          ESA="$(find target -name '*.esa' | head -1)"
          if [ -z "$ESA" ]; then
            echo "::error::No .esa archive was produced by the build"
            exit 1
          fi
          echo "path=$ESA" >> "$GITHUB_OUTPUT"
          echo "Found ESA: $ESA"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ inputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ ("^## \\[" v "\\]") { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release v$VERSION. See CHANGELOG.md for details." > release-notes.md
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ inputs.version }}"
          gh release create "v${VERSION}" \
            "${{ steps.esa.outputs.path }}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md
