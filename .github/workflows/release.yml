name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      # Checkout the tag commit initially
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Extract version from tag
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Target Release Version: $VERSION"

      # Guard against infinite loops: if the tag already points to a commit
      # where the version is bumped, we skip processing.
      - name: Check if version is already bumped
        id: guard
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          CURRENT_VERSION="$(grep -E '^Adapter-Version=' config.adk | cut -d= -f2 | tr -d '[:space:]')"
          echo "Current codebase version: $CURRENT_VERSION"
          if [ "$CURRENT_VERSION" = "$VERSION" ]; then
            echo "already_bumped=true" >> "$GITHUB_OUTPUT"
            echo "Version is already bumped in this commit. Skipping code modification."
          else
            echo "already_bumped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure Git Bot
        if: steps.guard.outputs.already_bumped == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update versions and changelog in codebase
        if: steps.guard.outputs.already_bumped == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          echo "Setting codebase version to $VERSION"
          
          # 1. Update config.adk
          sed -i "s/^Adapter-Version=.*/Adapter-Version=$VERSION/" config.adk
          
          # 2. Update pom.xml
          mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false
          
          # 3. Update Metadata XMLs (ComponentId und VariantId)
          find src/main/resources/metadata -name "metadata-*.xml" -type f -exec sed -i "s/\/version::[0-9.]*\"/\/version::$VERSION\"/g" {} +
          find src/main/resources/metadata -name "metadata-*.xml" -type f -exec sed -i "s/\/version::[0-9.]*<\/Name>/\/version::$VERSION<\/Name>/g" {} +
          
          # 4. Update CHANGELOG.md (replace Unreleased heading with the version and current date)
          TODAY=$(date +%Y-%m-%d)
          if grep -q "^## \[Unreleased\]" CHANGELOG.md; then
            echo "Updating CHANGELOG.md: replacing [Unreleased] with [$VERSION] - $TODAY"
            sed -i "s/^## \[Unreleased\]/## [$VERSION] - $TODAY/" CHANGELOG.md
          else
            echo "No [Unreleased] heading found in CHANGELOG.md. Skipping changelog update."
          fi

      - name: Commit and push version bump to main
        if: steps.guard.outputs.already_bumped == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          
          # Checkout main branch to apply the commit onto main
          git checkout main
          
          # Copy the changed files from the detached HEAD workspace
          git checkout HEAD -- config.adk pom.xml src/main/resources/metadata/ CHANGELOG.md
          
          git add config.adk pom.xml src/main/resources/metadata/ CHANGELOG.md
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git push origin main

      - name: Update tag to point to the new main commit
        if: steps.guard.outputs.already_bumped == 'false'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # Move tag to the new commit on main (which contains the skip ci commit)
          git tag -d "v$VERSION"
          git tag "v$VERSION" origin/main
          git push origin :refs/tags/v$VERSION
          git push origin "v$VERSION"

      # If we skipped because it was already bumped, we can just exit early in this job run
      # to prevent duplicate builds/releases.
      - name: Exit early for duplicate trigger
        if: steps.guard.outputs.already_bumped == 'true'
        run: |
          echo "This run was triggered by the tag re-push. Exiting to avoid duplicate build."
          exit 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test and package (produces the ESA)
        run: mvn -B clean install

      - name: Locate ESA artifact
        id: esa
        run: |
          ESA="$(find target -name '*.esa' | head -1)"
          if [ -z "$ESA" ]; then
            echo "::error::No .esa archive was produced by the build"
            exit 1
          fi
          echo "path=$ESA" >> "$GITHUB_OUTPUT"
          echo "Found ESA: $ESA"

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          awk -v v="$VERSION" '
            $0 ~ ("^## \\[" v "\\]") { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release v$VERSION. See CHANGELOG.md for details." > release-notes.md
          fi
          echo "----- release notes -----"
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          gh release create "v${VERSION}" \
            "${{ steps.esa.outputs.path }}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md
